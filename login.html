<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<script>
  const savedTheme = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
</script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MTN Co.</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root[data-theme="light"] {
      --bg: #f2ede8;
      --bg2: #e8e2da;
      --surface: #faf8f5;
      --border: #ccc5bb;
      --text: #1a1917;
      --muted: #6b6259;
      --accent: #9c7248;
      --accent2: #8c6238;
      --card-bg: #faf8f5;
    }
    :root[data-theme="dark"] {
      --bg: #141210;
      --bg2: #1e1c19;
      --surface: #242220;
      --border: #3a3733;
      --text: #f0ece6;
      --muted: #9c9488;
      --accent: #9c7248;
      --accent2: #8c6238;
      --card-bg: #1e1c19;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .blob1 { width: 400px; height: 400px; background: var(--accent); top: -100px; right: -100px; }
    .blob2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; left: -80px; animation-delay: 3s; }
    @keyframes float {
      0%, 100% { transform: translate(0,0) scale(1); }
      50% { transform: translate(20px,-20px) scale(1.05); }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .logo { display:flex; align-items:center; gap:10px; } .logo span { color: var(--accent); }
    .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 36px; }
    .tabs {
      display: flex;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .tab.active {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .form { display: none; }
    .form.active { display: block; }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .erro {
      background: rgba(255,60,95,0.1);
      border: 1px solid rgba(255,60,95,0.3);
      color: #ff3c5f;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .erro.show { display: block; }
    .voltar { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .voltar a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }
    .theme-toggle:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
<button class="theme-toggle" onclick="toggleTheme()" title="Alternar tema">🌙</button>
<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="card">
  <div class="logo" style="display:flex;align-items:center;gap:10px"><svg width="38" height="30" viewBox="0 0 38 30" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:inline-block;vertical-align:middle;flex-shrink:0">
  <!-- Montanha esquerda (maior) -->
  <polyline points="1,29 13,4 19,14 25,4 37,29" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="miter"/>
  <!-- Base fechando -->
  <line x1="1" y1="29" x2="37" y2="29" stroke="currentColor" stroke-width="2.4"/>
  <!-- Losango vale esquerdo -->
  <polygon points="13,4 10,10 13,16 16,10" fill="currentColor"/>
  <!-- Losango vale direito -->
  <polygon points="25,4 22,10 25,16 28,10" fill="currentColor"/>
</svg> <span style="letter-spacing:-1px">MTN</span></div>
  <div class="subtitle">Mountain Streetwear · Marechal Floriano, ES</div>
  <div class="tabs">
    <button class="tab active" id="tab-entrar" onclick="trocarAba('login', this)">Entrar</button>
    <button class="tab" id="tab-cadastro" onclick="trocarAba('cadastro', this)">Cadastrar</button>
  </div>
  <div class="form active" id="form-login">
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="********">
    </div>
    <button class="btn btn-primary" id="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="erro" id="erro-login"></div>
  </div>
  <div class="form" id="form-cadastro">
    <div class="form-group">
      <label>Nome completo</label>
      <input type="text" id="cad-nome" placeholder="Seu nome">
    </div>
    <div class="form-group">
      <label>E-mail</label>
      <input type="email" id="cad-email" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="cad-senha" placeholder="Minimo 6 caracteres">
    </div>
    <button class="btn btn-primary" id="btn-cadastro" onclick="fazerCadastro()">Criar conta</button>
    <div class="erro" id="erro-cadastro"></div>
  </div>
  <div class="voltar"><a href="/index.html">Voltar para a loja</a></div>
</div>
<script type="module">
  import { login, cadastrarUsuario, verificarAdmin } from "./auth.js";

  window.trocarAba = function(aba, el) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.form').forEach(function(f) { f.classList.remove('active'); });
    document.getElementById('form-' + aba).classList.add('active');
    el.classList.add('active');
  };

  window.fazerLogin = async function() {
    var email = document.getElementById('login-email').value.trim();
    var senha = document.getElementById('login-senha').value;
    var erro = document.getElementById('erro-login');
    var btn = document.getElementById('btn-login');
    if (!email || !senha) {
      erro.textContent = 'Preencha e-mail e senha.';
      erro.classList.add('show');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    erro.classList.remove('show');
    try {
      var usuario = await login(email, senha);
      var ehAdmin = await verificarAdmin(usuario.uid);
      window.location.href = ehAdmin ? '/admin.html' : '/index.html';
    } catch(err) {
      erro.textContent = err.message;
      erro.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  };

  window.fazerCadastro = async function() {
    var nome = document.getElementById('cad-nome').value.trim();
    var email = document.getElementById('cad-email').value.trim();
    var senha = document.getElementById('cad-senha').value;
    var erro = document.getElementById('erro-cadastro');
    var btn = document.getElementById('btn-cadastro');
    if (!nome || !email || !senha) {
      erro.textContent = 'Preencha todos os campos.';
      erro.classList.add('show');
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Criando conta...';
    erro.classList.remove('show');
    try {
      await cadastrarUsuario(nome, email, senha);
      window.location.href = '/index.html';
    } catch(err) {
      erro.textContent = err.message;
      erro.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Criar conta';
    }
  };

  // Restore toggle icon correctly
  document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('theme') || 'light';
    const btn = document.querySelector('.theme-toggle');
    if(btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
  });

  window.toggleTheme = function() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', next);
  };
</script>
</body>
</html>
